name: local_music_player
description: Premium local music player inspired by YouTube Music. Offline-first, no accounts, no streaming.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Audio
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Local media discovery (Android primary; iOS limited)
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  file_picker: ^8.1.4

  # Persistence
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # UI helpers
  cached_network_image: ^3.4.1  # only for potential remote fallback art; prefer local
  flutter_svg: ^2.0.14
  collection: ^1.18.0
  rxdart: ^0.28.0
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  drift_dev: ^2.21.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/audio/fixtures/
